<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LODTEC — Pokémons Shiny</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root {
    --bg: #14111f;
    --surface: #1d1930;
    --surface2: #241f3a;
    --line: #332c50;
    --gold: #f4c542;
    --teal: #5eead4;
    --text: #f2ede4;
    --muted: #a79fc4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, #2a2247 0%, transparent 45%),
      radial-gradient(circle at 90% 20%, #1f1a38 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    padding-bottom: 40px;
  }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
  .muted { color: var(--muted); font-size: 13.5px; line-height: 1.5; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 24px 16px; flex-wrap: wrap; gap: 14px;
  }
  .header-brand { display: flex; align-items: center; gap: 9px; }
  .brand-icon { color: var(--gold); filter: drop-shadow(0 0 6px rgba(244,197,66,.5)); font-size: 20px; }
  .header-brand h1 { font-size: 21px; letter-spacing: -0.01em; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; color: var(--muted);
  }
  .search input {
    background: none; border: none; outline: none; color: var(--text);
    font-family: inherit; font-size: 14px; width: 190px;
  }
  .sparkline { display: block; margin: 0 24px 6px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .main-tabs { display: flex; gap: 8px; padding: 0 24px 12px; }
  .main-tab {
    flex: 1; text-align: center; padding: 10px; border-radius: 12px; font-weight: 600; font-size: 13px;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    font-family: 'Space Grotesk', sans-serif; cursor: pointer;
  }
  .main-tab--active { background: rgba(244,197,66,.12); border-color: var(--gold); color: var(--gold); }
  .placeholder-box {
    margin: 10px 24px; padding: 50px 20px; text-align: center; background: var(--surface);
    border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); font-size: 13px;
  }
  .placeholder-box b { display: block; color: var(--gold); font-family: 'Space Grotesk', sans-serif; font-size: 15px; margin-bottom: 6px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 24px 4px; }
  .filter-btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; font-weight: 500;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .filter-btn--active { background: rgba(244,197,66,.12); border-color: var(--gold); color: var(--gold); }
  .filter-btn--novos { border-color: var(--teal); color: var(--teal); }
  .filter-btn--novos.filter-btn--active { background: rgba(94,234,212,.12); border-color: var(--teal); color: var(--teal); }
  .filter-btn--evento { border-color: #d88be0; color: #d88be0; }
  .filter-btn--evento.filter-btn--active { background: rgba(216,139,224,.12); border-color: #d88be0; color: #d88be0; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px; padding: 20px 24px;
  }
  .empty { grid-column: 1/-1; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); padding: 60px 0; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; text-align: left; cursor: pointer; color: inherit;
    font-family: inherit; padding: 0; transition: transform .18s ease, border-color .18s ease;
    position: relative; display: block; width: 100%;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--gold); }
  .card--sold { opacity: .55; cursor: default; }
  .card--sold:hover { transform: none; border-color: var(--line); }
  .card-photo { position: relative; aspect-ratio: 1/1; background: var(--surface2); overflow: hidden; }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-photo-empty { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 26px; }
  .card-spark { position: absolute; top: 10px; right: 10px; color: var(--gold); font-size: 14px; filter: drop-shadow(0 0 4px rgba(244,197,66,.7)); }
  .new-badge {
    position: absolute; top: 8px; left: 8px; background: var(--teal); color: #06231f;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 999px; letter-spacing: 0.03em; z-index: 2;
  }
  .card-soldtag {
    position: absolute; bottom: 0; left: 0; right: 0; background: rgba(20,17,31,.85);
    padding: 6px 10px; font-size: 11.5px; text-align: center; color: var(--muted);
  }
  .zoom-btn {
    position: absolute; bottom: 8px; left: 8px; background: rgba(20,17,31,.78);
    border: 1px solid rgba(244,197,66,.5); color: var(--gold); font-size: 11px;
    padding: 5px 9px; border-radius: 999px; cursor: pointer; z-index: 2;
  }
  .zoom-btn--inline {
    position: static; display: inline-flex; margin-top: 8px; background: var(--surface2);
  }
  .lightbox-overlay { z-index: 60; flex-direction: column; gap: 12px; }
  .lightbox-img { max-width: 100%; max-height: 75vh; border-radius: 14px; object-fit: contain; border: 1px solid var(--line); }
  .lightbox-caption { color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 16px; }
  .lightbox-close { position: fixed; top: 20px; right: 20px; background: var(--surface2); border-radius: 50%; width: 36px; height: 36px; font-size: 22px; }
  .card-body { padding: 13px 14px 15px; }
  .card-toprow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-toprow h3 { font-size: 15.5px; }
  .card-price { font-family: 'IBM Plex Mono', monospace; color: var(--gold); font-size: 14px; white-space: nowrap; }
  .card-meta { display: flex; align-items: center; flex-wrap: wrap; margin-top: 8px; gap: 6px; }
  .card-sexo { font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .cat-tag {
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    background: rgba(94,234,212,.1); color: var(--teal);
    border: 1px solid rgba(94,234,212,.35); border-radius: 999px; padding: 2px 7px;
  }
  .card-dates { display: flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 12px; color: var(--teal); }

  .footer {
    padding: 18px 24px 0; color: var(--muted); font-size: 12.5px;
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(10,8,18,.72); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    width: 420px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative;
  }
  .modal--small { width: 320px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; }
  .modal-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .modal-thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
  .back-link { background: none; border: none; color: var(--muted); display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px; padding: 0; }
  .err { color: #f77; font-size: 12px; margin-top: 6px; }

  .field-label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  .input {
    width: 100%; background: var(--surface2); border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 12px; color: var(--text); font-family: inherit; font-size: 14px; outline: none;
  }
  .input:focus { border-color: var(--gold); }

  .date-grid { display: flex; flex-wrap: wrap; gap: 7px; max-height: 160px; overflow-y: auto; }
  .date-pill {
    background: var(--surface2); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; font-family: 'IBM Plex Mono', monospace;
  }
  .date-pill--active { border-color: var(--gold); color: var(--gold); background: rgba(244,197,66,.1); }

  .mcal-wrap {
    display: flex; flex-direction: column; gap: 16px; max-height: 420px; overflow-y: auto;
    padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface2);
  }
  .mcal-month-title {
    font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; color: var(--gold);
    margin-bottom: 8px; text-align: center; text-transform: capitalize;
  }
  .mcal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .mcal-weekdays span { text-align: center; font-size: 10px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .mcal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .mcal-day {
    aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer; padding: 0;
  }
  .mcal-day:hover { border-color: var(--gold); }
  .mcal-day--empty { background: none; border: none; cursor: default; }
  .mcal-day--past { opacity: .35; cursor: not-allowed; }
  .mcal-day--selected { background: rgba(244,197,66,.18); border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .mcal-summary { font-size: 12.5px; color: var(--teal); font-family: 'IBM Plex Mono', monospace; padding: 2px 2px 0; }

  .leilao-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin: 0 24px 16px; }
  .leilao-photo { position: relative; aspect-ratio: 16/10; background: var(--surface2); }
  .leilao-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .leilao-badge { position: absolute; top: 10px; left: 10px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; font-family: 'IBM Plex Mono', monospace; }
  .leilao-badge--ativo { background: var(--teal); color: #06231f; }
  .leilao-badge--agendado { background: var(--gold); color: #201a08; }
  .leilao-badge--encerrado { background: var(--muted); color: #1a1728; }
  .leilao-timer { position: absolute; bottom: 10px; right: 10px; background: rgba(20,17,31,.85); color: var(--gold); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 4px 9px; border-radius: 999px; }
  .leilao-body { padding: 14px; }
  .leilao-nome { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .leilao-inc-info { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }
  .leilao-atual-box { display: flex; justify-content: space-between; align-items: baseline; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .leilao-atual-valor { font-family: 'IBM Plex Mono', monospace; color: var(--gold); font-size: 18px; font-weight: 700; }
  .leilao-ultimo { font-size: 11.5px; color: var(--teal); margin-bottom: 10px; }
  .leilao-bid-row { display: flex; gap: 8px; }
  .leilao-bid-row input { flex: 1; }
  .leilao-next-label { margin: 0 24px 8px; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .leilao-next-card { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 24px 10px; display: flex; gap: 12px; align-items: center; }
  .leilao-next-thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
  .leilao-next-nome { font-size: 14px; color: var(--text); font-weight: 600; }
  .leilao-next-info { font-size: 11.5px; color: var(--muted); }

  .btn {
    border-radius: 10px; padding: 11px 18px; font-family: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: none;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn--primary { background: var(--gold); color: #201a08; width: 100%; }
  .btn--ghost { background: none; border: 1px solid var(--line); color: var(--text); }
  .btn--whats { background: #25d366; color: #06210f; width: 100%; text-decoration: none; margin-top: 16px; }

  .pixbox {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface2); border: 1px dashed var(--gold); border-radius: 10px;
    padding: 12px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; word-break: break-all; margin-top: 6px;
  }
  .pixbox button { background: none; border: none; color: var(--gold); cursor: pointer; flex-shrink: 0; font-size: 15px; }

  .success { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 6px 4px; }
  .success .icon { font-size: 40px; }

  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn {
    flex: 1; background: var(--surface2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 9px; padding: 9px; font-size: 12.5px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  }
  .toggle-btn--active { border-color: var(--teal); color: var(--teal); background: rgba(94,234,212,.08); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--gold); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 100;
  }
  .waiting-row { display: flex; align-items: center; gap: 10px; color: var(--teal); font-size: 13px; margin-top: 14px; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(94,234,212,.25);
    border-top-color: var(--teal); animation: spin 0.8s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }

  .header-right { display: flex; align-items: center; gap: 10px; }
  .adm-btn {
    background: var(--surface2); border: 1px solid var(--line); color: var(--muted);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .05em;
    padding: 9px 10px; border-radius: 10px; cursor: pointer;
  }
  .adm-btn:hover { border-color: var(--gold); color: var(--gold); }

  .cart-btn {
    position: relative; background: var(--surface2); border: 1px solid var(--line); color: var(--text);
    font-size: 15px; padding: 8px 11px; border-radius: 10px; cursor: pointer;
  }
  .cart-btn:hover { border-color: var(--teal); }
  .cart-count {
    position: absolute; top: -6px; right: -6px; background: var(--gold); color: #201a08;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700;
    min-width: 17px; height: 17px; border-radius: 999px; align-items: center; justify-content: center; padding: 0 3px;
  }

  .cart-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; margin: 10px 0; }
  .cart-item { display: flex; gap: 10px; align-items: center; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 9px; }
  .cart-item img, .cart-item .ph {
    width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
    background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 15px;
  }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-info strong { font-size: 12.5px; display: block; }
  .cart-item-info .sub { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .cart-item-info .countdown { font-family: 'IBM Plex Mono', monospace; color: var(--teal); }
  .cart-item button {
    background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 7px;
    padding: 5px 9px; font-size: 10.5px; cursor: pointer; flex-shrink: 0;
  }
  .total-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line);
  }
  .total-row .num { font-family: 'Space Grotesk', sans-serif; font-size: 19px; color: var(--gold); }

  .admin-wrap { max-width: 720px; margin: 0 auto; padding: 20px 20px 60px; }
  .admin-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 10px; }
  .admin-topbar h1 { font-size: 19px; }
  .admin-section { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 18px; }
  .search-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 12px; margin-bottom: 14px; color: var(--muted);
  }
  .search-row input {
    background: none; border: none; outline: none; color: var(--text);
    font-family: inherit; font-size: 13.5px; width: 100%;
  }
  .admin-section h2 { font-size: 15px; margin-bottom: 12px; }
  .file-drop {
    border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center;
    color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .file-drop:hover { border-color: var(--gold); color: var(--gold); }
  .pending-list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .pending-card { display: flex; gap: 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .pending-card img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .pending-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .pending-fields .row { display: flex; gap: 6px; }
  .pending-fields input, .pending-fields select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px; color: var(--text);
    font-family: inherit; font-size: 12.5px; padding: 6px 8px; outline: none; width: 100%;
  }
  .pending-remove { background: none; border: none; color: var(--muted); cursor: pointer; align-self: flex-start; font-size: 16px; }
  .admin-list { display: flex; flex-direction: column; gap: 8px; }
  .admin-row {
    display: flex; align-items: center; gap: 10px; background: var(--surface2);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  }
  .admin-row img { width: 40px; height: 40px; border-radius: 7px; object-fit: cover; flex-shrink: 0; }
  .admin-row-info { flex: 1; min-width: 0; }
  .admin-row-info strong { display: block; font-size: 13px; }
  .admin-row-info span { font-size: 11.5px; color: var(--muted); }
  .conta-tag { color: var(--teal); font-family: 'IBM Plex Mono', monospace; }

  .vendas-summary { display: flex; gap: 10px; margin-bottom: 12px; }
  .summary-box { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; flex: 1; }
  .summary-box .num { font-family: 'Space Grotesk', sans-serif; font-size: 18px; color: var(--gold); line-height: 1.3; }
  .summary-box .lbl { font-size: 10.5px; color: var(--muted); }

  .venda-row { display: flex; gap: 10px; align-items: center; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 9px;
