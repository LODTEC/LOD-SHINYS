<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LODTEC — Pokémons Shiny</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root {
    --bg: #14111f;
    --surface: #1d1930;
    --surface2: #241f3a;
    --line: #332c50;
    --gold: #f4c542;
    --teal: #5eead4;
    --text: #f2ede4;
    --muted: #a79fc4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, #2a2247 0%, transparent 45%),
      radial-gradient(circle at 90% 20%, #1f1a38 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    padding-bottom: 40px;
  }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
  .muted { color: var(--muted); font-size: 13.5px; line-height: 1.5; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 24px 16px; flex-wrap: wrap; gap: 14px;
  }
  .header-brand { display: flex; align-items: center; gap: 9px; }
  .brand-icon { color: var(--gold); filter: drop-shadow(0 0 6px rgba(244,197,66,.5)); font-size: 20px; }
  .header-brand h1 { font-size: 21px; letter-spacing: -0.01em; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; color: var(--muted);
  }
  .search input {
    background: none; border: none; outline: none; color: var(--text);
    font-family: inherit; font-size: 14px; width: 190px;
  }
  .sparkline { display: block; margin: 0 24px 6px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .main-tabs { display: flex; gap: 8px; padding: 0 24px 12px; }
  .main-tab {
    flex: 1; text-align: center; padding: 10px; border-radius: 12px; font-weight: 600; font-size: 13px;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    font-family: 'Space Grotesk', sans-serif; cursor: pointer;
  }
  .main-tab--active { background: rgba(244,197,66,.12); border-color: var(--gold); color: var(--gold); }
  .placeholder-box {
    margin: 10px 24px; padding: 50px 20px; text-align: center; background: var(--surface);
    border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); font-size: 13px;
  }
  .placeholder-box b { display: block; color: var(--gold); font-family: 'Space Grotesk', sans-serif; font-size: 15px; margin-bottom: 6px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 24px 4px; }
  .filter-btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; font-weight: 500;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .filter-btn--active { background: rgba(244,197,66,.12); border-color: var(--gold); color: var(--gold); }
  .filter-btn--novos { border-color: var(--teal); color: var(--teal); }
  .filter-btn--novos.filter-btn--active { background: rgba(94,234,212,.12); border-color: var(--teal); color: var(--teal); }
  .filter-btn--evento { border-color: #d88be0; color: #d88be0; }
  .filter-btn--evento.filter-btn--active { background: rgba(216,139,224,.12); border-color: #d88be0; color: #d88be0; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px; padding: 20px 24px;
  }
  .empty { grid-column: 1/-1; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); padding: 60px 0; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; text-align: left; cursor: pointer; color: inherit;
    font-family: inherit; padding: 0; transition: transform .18s ease, border-color .18s ease;
    position: relative; display: block; width: 100%;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--gold); }
  .card--sold { opacity: .55; cursor: default; }
  .card--sold:hover { transform: none; border-color: var(--line); }
  .card-photo { position: relative; aspect-ratio: 1/1; background: var(--surface2); overflow: hidden; }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-photo-empty { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 26px; }
  .card-spark { position: absolute; top: 10px; right: 10px; color: var(--gold); font-size: 14px; filter: drop-shadow(0 0 4px rgba(244,197,66,.7)); }
  .new-badge {
    position: absolute; top: 8px; left: 8px; background: var(--teal); color: #06231f;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 999px; letter-spacing: 0.03em; z-index: 2;
  }
  .card-soldtag {
    position: absolute; bottom: 0; left: 0; right: 0; background: rgba(20,17,31,.85);
    padding: 6px 10px; font-size: 11.5px; text-align: center; color: var(--muted);
  }
  .zoom-btn {
    position: absolute; bottom: 8px; left: 8px; background: rgba(20,17,31,.78);
    border: 1px solid rgba(244,197,66,.5); color: var(--gold); font-size: 11px;
    padding: 5px 9px; border-radius: 999px; cursor: pointer; z-index: 2;
  }
  .zoom-btn--inline {
    position: static; display: inline-flex; margin-top: 8px; background: var(--surface2);
  }
  .lightbox-overlay { z-index: 60; flex-direction: column; gap: 12px; }
  .lightbox-img { max-width: 100%; max-height: 75vh; border-radius: 14px; object-fit: contain; border: 1px solid var(--line); }
  .lightbox-caption { color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 16px; }
  .lightbox-close { position: fixed; top: 20px; right: 20px; background: var(--surface2); border-radius: 50%; width: 36px; height: 36px; font-size: 22px; }
  .card-body { padding: 13px 14px 15px; }
  .card-toprow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-toprow h3 { font-size: 15.5px; }
  .card-price { font-family: 'IBM Plex Mono', monospace; color: var(--gold); font-size: 14px; white-space: nowrap; }
  .card-meta { display: flex; align-items: center; flex-wrap: wrap; margin-top: 8px; gap: 6px; }
  .card-sexo { font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .cat-tag {
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    background: rgba(94,234,212,.1); color: var(--teal);
    border: 1px solid rgba(94,234,212,.35); border-radius: 999px; padding: 2px 7px;
  }
  .card-dates { display: flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 12px; color: var(--teal); }

  .footer {
    padding: 18px 24px 0; color: var(--muted); font-size: 12.5px;
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(10,8,18,.72); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    width: 420px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative;
  }
  .modal--small { width: 320px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; }
  .modal-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .modal-thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
  .back-link { background: none; border: none; color: var(--muted); display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px; padding: 0; }
  .err { color: #f77; font-size: 12px; margin-top: 6px; }

  .field-label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  .input {
    width: 100%; background: var(--surface2); border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 12px; color: var(--text); font-family: inherit; font-size: 14px; outline: none;
  }
  .input:focus { border-color: var(--gold); }

  .date-grid { display: flex; flex-wrap: wrap; gap: 7px; max-height: 160px; overflow-y: auto; }
  .date-pill {
    background: var(--surface2); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; font-family: 'IBM Plex Mono', monospace;
  }
  .date-pill--active { border-color: var(--gold); color: var(--gold); background: rgba(244,197,66,.1); }

  .mcal-wrap {
    display: flex; flex-direction: column; gap: 16px; max-height: 420px; overflow-y: auto;
    padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface2);
  }
  .mcal-month-title {
    font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; color: var(--gold);
    margin-bottom: 8px; text-align: center; text-transform: capitalize;
  }
  .mcal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .mcal-weekdays span { text-align: center; font-size: 10px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .mcal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .mcal-day {
    aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer; padding: 0;
  }
  .mcal-day:hover { border-color: var(--gold); }
  .mcal-day--empty { background: none; border: none; cursor: default; }
  .mcal-day--past { opacity: .35; cursor: not-allowed; }
  .mcal-day--selected { background: rgba(244,197,66,.18); border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .mcal-summary { font-size: 12.5px; color: var(--teal); font-family: 'IBM Plex Mono', monospace; padding: 2px 2px 0; }

  .btn {
    border-radius: 10px; padding: 11px 18px; font-family: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: none;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn--primary { background: var(--gold); color: #201a08; width: 100%; }
  .btn--ghost { background: none; border: 1px solid var(--line); color: var(--text); }
  .btn--whats { background: #25d366; color: #06210f; width: 100%; text-decoration: none; margin-top: 16px; }

  .pixbox {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface2); border: 1px dashed var(--gold); border-radius: 10px;
    padding: 12px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; word-break: break-all; margin-top: 6px;
  }
  .pixbox button { background: none; border: none; color: var(--gold); cursor: pointer; flex-shrink: 0; font-size: 15px; }

  .success { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 6px 4px; }
  .success .icon { font-size: 40px; }

  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn {
    flex: 1; background: var(--surface2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 9px; padding: 9px; font-size: 12.5px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  }
  .toggle-btn--active { border-color: var(--teal); color: var(--teal); background: rgba(94,234,212,.08); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--gold); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 100;
  }
  .waiting-row { display: flex; align-items: center; gap: 10px; color: var(--teal); font-size: 13px; margin-top: 14px; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(94,234,212,.25);
    border-top-color: var(--teal); animation: spin 0.8s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }

  .header-right { display: flex; align-items: center; gap: 10px; }
  .adm-btn {
    background: var(--surface2); border: 1px solid var(--line); color: var(--muted);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .05em;
    padding: 9px 10px; border-radius: 10px; cursor: pointer;
  }
  .adm-btn:hover { border-color: var(--gold); color: var(--gold); }

  .cart-btn {
    position: relative; background: var(--surface2); border: 1px solid var(--line); color: var(--text);
    font-size: 15px; padding: 8px 11px; border-radius: 10px; cursor: pointer;
  }
  .cart-btn:hover { border-color: var(--teal); }
  .cart-count {
    position: absolute; top: -6px; right: -6px; background: var(--gold); color: #201a08;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700;
    min-width: 17px; height: 17px; border-radius: 999px; align-items: center; justify-content: center; padding: 0 3px;
  }

  .cart-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; margin: 10px 0; }
  .cart-item { display: flex; gap: 10px; align-items: center; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 9px; }
  .cart-item img, .cart-item .ph {
    width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
    background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 15px;
  }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-info strong { font-size: 12.5px; display: block; }
  .cart-item-info .sub { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .cart-item-info .countdown { font-family: 'IBM Plex Mono', monospace; color: var(--teal); }
  .cart-item button {
    background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 7px;
    padding: 5px 9px; font-size: 10.5px; cursor: pointer; flex-shrink: 0;
  }
  .total-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line);
  }
  .total-row .num { font-family: 'Space Grotesk', sans-serif; font-size: 19px; color: var(--gold); }

  .admin-wrap { max-width: 720px; margin: 0 auto; padding: 20px 20px 60px; }
  .admin-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 10px; }
  .admin-topbar h1 { font-size: 19px; }
  .admin-section { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 18px; }
  .search-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 12px; margin-bottom: 14px; color: var(--muted);
  }
  .search-row input {
    background: none; border: none; outline: none; color: var(--text);
    font-family: inherit; font-size: 13.5px; width: 100%;
  }
  .admin-section h2 { font-size: 15px; margin-bottom: 12px; }
  .file-drop {
    border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center;
    color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .file-drop:hover { border-color: var(--gold); color: var(--gold); }
  .pending-list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .pending-card { display: flex; gap: 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .pending-card img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .pending-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .pending-fields .row { display: flex; gap: 6px; }
  .pending-fields input, .pending-fields select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px; color: var(--text);
    font-family: inherit; font-size: 12.5px; padding: 6px 8px; outline: none; width: 100%;
  }
  .pending-remove { background: none; border: none; color: var(--muted); cursor: pointer; align-self: flex-start; font-size: 16px; }
  .admin-list { display: flex; flex-direction: column; gap: 8px; }
  .admin-row {
    display: flex; align-items: center; gap: 10px; background: var(--surface2);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  }
  .admin-row img { width: 40px; height: 40px; border-radius: 7px; object-fit: cover; flex-shrink: 0; }
  .admin-row-info { flex: 1; min-width: 0; }
  .admin-row-info strong { display: block; font-size: 13px; }
  .admin-row-info span { font-size: 11.5px; color: var(--muted); }
  .conta-tag { color: var(--teal); font-family: 'IBM Plex Mono', monospace; }

  .vendas-summary { display: flex; gap: 10px; margin-bottom: 12px; }
  .summary-box { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; flex: 1; }
  .summary-box .num { font-family: 'Space Grotesk', sans-serif; font-size: 18px; color: var(--gold); line-height: 1.3; }
  .summary-box .lbl { font-size: 10.5px; color: var(--muted); }

  .venda-row { display: flex; gap: 10px; align-items: center; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 9px; margin-bottom: 8px; }
  .venda-row img, .venda-row .ph {
    width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
    background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 15px;
  }
  .venda-info { flex: 1; min-width: 0; }
  .venda-info .top { display: flex; justify-content: space-between; gap: 8px; }
  .venda-info strong { font-size: 12.5px; }
  .venda-price { font-family: 'IBM Plex Mono', monospace; color: var(--gold); font-size: 12px; white-space: nowrap; }
  .venda-sub { font-size: 10.5px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; padding: 2px 6px; border-radius: 999px; margin-right: 4px; display: inline-block; }
  .tag--conta { color: var(--teal); background: rgba(94,234,212,.1); border: 1px solid rgba(94,234,212,.3); }
  .tag--reg-sim { color: #7ee787; background: rgba(126,231,135,.1); border: 1px solid rgba(126,231,135,.3); }
  .tag--reg-nao { color: var(--gold); background: rgba(244,197,66,.1); border: 1px solid rgba(244,197,66,.35); }
  .tag--manual { color: var(--muted); background: rgba(167,159,196,.08); border: 1px solid var(--line); }

  .admin-row button {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 6px 9px; font-size: 11.5px; cursor: pointer; flex-shrink: 0;
  }
  .admin-row button.danger, .venda-row button.danger { color: #f77; border-color: rgba(247,119,119,.4); }
  .venda-row button.danger {
    background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 9px; font-size: 11px; cursor: pointer; flex-shrink: 0; align-self: center;
  }
  .date-range-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .date-range-row label { font-size: 12px; color: var(--muted); }
  .date-range-row input {
    background: var(--surface2); border: 1px solid var(--line); border-radius: 7px;
    color: var(--text); font-family: inherit; font-size: 13px; padding: 7px 9px;
  }

  @media (max-width: 480px) {
    .header { padding: 18px 16px 12px; }
    .sparkline { margin: 0 16px 6px; }
    .filter-row { padding: 14px 16px 4px; }
    .grid { padding: 14px 16px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .search input { width: 120px; }
  }
</style>
</head>

<script type="module">

const POKES_COLLECTION = "pokemons";

function whatsappParaEmail(whatsapp) {

  return `cliente${digits}@lodtecloja.com`;

/* ---------- vendas + bloqueio automático por conta ---------- */
function ehSexta(dataStr) {
  const d = new Date(dataStr + "T00:00:00");
  return d.getDay() === 5;
}

async function fbCarregarVendas() {
  const snap = await getDocs(collection(db, VENDAS_COLLECTION));
  return snap.docs.map((d) => ({ ...d.data(), id: d.id }));
}

async function fbExcluirVenda(id) {
  return deleteDoc(doc(db, VENDAS_COLLECTION, id));
}

async function fbCarregarReservas() {
  const snap = await getDocs(collection(db, RESERVAS_COLLECTION));
  return snap.docs.map((d) => ({ ...d.data(), id: d.id }));
}

function reservaExpirada(r) {
  return !r.expiraEm || Date.now() > r.expiraEm;
}

// Conta quantas vendas+reservas ativas já usam essa conta+data, e se atingiu o limite
// (1 por dia, 2 na sexta), tira essa data dos outros Pokémons da mesma conta.
async function aplicarBloqueioConta(conta, data, idParaIgnorar) {
  if (!conta) return;
  const limite = ehSexta(data) ? 2 : 1;
  const [vendas, reservas] = await Promise.all([fbCarregarVendas(), fbCarregarReservas()]);
  const reservasAtivas = reservas.filter((r) => !reservaExpirada(r));
  const total =
    vendas.filter((v) => v.conta === conta && v.data === data).length +
    reservasAtivas.filter((r) => r.conta === conta && r.data === data).length;
  if (total >= limite) {
    const pokesSnap = await getDocs(collection(db, POKES_COLLECTION));
    for (const d of pokesSnap.docs) {
      if (d.id === idParaIgnorar) continue;
      const p = d.data();
      if (p.conta === conta && Array.isArray(p.datas) && p.datas.includes(data)) {
        await updateDoc(doc(db, POKES_COLLECTION, d.id), { datas: p.datas.filter((x) => x !== data) });
      }
    }
  }
}

// Ao cadastrar/editar um Pokémon com um intervalo de datas, tira automaticamente as
// datas que a conta dele já tem ocupadas (por vendas ou reservas ativas), respeitando
// o limite do dia (1, ou 2 na sexta-feira).
async function filtrarDatasDisponiveisConta(conta, datas) {
  if (!conta || !Array.isArray(datas) || datas.length === 0) return datas;
  const [vendas, reservas] = await Promise.all([fbCarregarVendas(), fbCarregarReservas()]);
  const reservasAtivas = reservas.filter((r) => !reservaExpirada(r));
  return datas.filter((data) => {
    const limite = ehSexta(data) ? 2 : 1;
    const usadas =
      vendas.filter((v) => v.conta === conta && v.data === data).length +
      reservasAtivas.filter((r) => r.conta === conta && r.data === data).length;
    return usadas < limite;
  });
}

// Libera uma reserva: Pokémon volta a aparecer (como "novo") e a reserva é apagada.
async function liberarReserva(reserva) {
  try {
    const pokeSnap = await getDoc(doc(db, POKES_COLLECTION, reserva.pokemonId));
    if (pokeSnap.exists()) {
      await updateDoc(doc(db, POKES_COLLECTION, reserva.pokemonId), {
        reservado: false, reservaExpiraEm: null, reservaClienteUid: null, order: Date.now(),
      });
    }
  } catch (err) { console.error(err); }
  try {
    await deleteDoc(doc(db, RESERVAS_COLLECTION, reserva.id));
  } catch (err) { console.error(err); }
}

// Roda toda vez que o site carrega: libera qualquer reserva que passou de 72h.
async function limparReservasVencidas() {
  try {
    const reservas = await fbCarregarReservas();
    const vencidas = reservas.filter(reservaExpirada);
    for (const r of vencidas) {
      await liberarReserva(r);
    }
  } catch (err) {
    console.error("Erro ao limpar reservas vencidas", err);
  }
}

// Cria a reserva (carrinho) de um Pokémon pra um cliente. Lança erro se o cliente
// já tiver reserva/venda pra essa mesma data (respeitando a exceção de sexta-feira).
async function adicionarAoCarrinho(p, data, registrado) {
  const limite = ehSexta(data) ? 2 : 1;
  const [vendas, reservas] = await Promise.all([fbCarregarVendas(), fbCarregarReservas()]);
  const reservasAtivas = reservas.filter((r) => !reservaExpirada(r));
  const usadasPeloCliente =
    vendas.filter((v) => v.clienteUid === clienteAtual.uid && v.data === data).length +
    reservasAtivas.filter((r) => r.clienteUid === clienteAtual.uid && r.data === data).length;
  if (usadasPeloCliente >= limite) {
    throw new Error(`Você já tem uma troca marcada para ${formatDate(data)}. Escolha outra data.`);
  }

  const expiraEm = Date.now() + RESERVA_HORAS * 60 * 60 * 1000;
  const reservaId = `${clienteAtual.uid}-${p.id}-${Date.now()}`;
  await setDoc(doc(db, RESERVAS_COLLECTION, reservaId), {
    pokemonId: p.id,
    pokemonNome: p.nome,
    pokemonFoto: p.foto || "",
    preco: p.preco,
    conta: p.conta || "",
    data,
    registrado: !!registrado,
    clienteUid: clienteAtual.uid,
    clienteNome: clienteAtual.nome,
    clienteWhatsapp: clienteAtual.whatsapp,
    criadoEm: Date.now(),
    expiraEm,
  });
  await updateDoc(doc(db, POKES_COLLECTION, p.id), {
    reservado: true, reservaExpiraEm: expiraEm, reservaClienteUid: clienteAtual.uid,
  });
  await aplicarBloqueioConta(p.conta, data, p.id);
}

// Registra a venda (id determinístico evita duplicar se rodar 2x) e aplica o bloqueio.
async function registrarVendaEBloquear({ vendaId, pokemon, data, clienteNome, clienteWhatsapp, clienteUid, origem, registrado }) {
  const vendaRef = doc(db, VENDAS_COLLECTION, vendaId);
  const jaExiste = await getDoc(vendaRef);
  if (jaExiste.exists()) return; // já processado (evita duplicar)

  await setDoc(vendaRef, {
    pokemonId: pokemon.id,
    pokemonNome: pokemon.nome,
    pokemonFoto: pokemon.foto || "",
    preco: pokemon.preco,
    conta: pokemon.conta || "",
    data,
    clienteNome: clienteNome || "",
    clienteWhatsapp: clienteWhatsapp || "",
    clienteUid: clienteUid || "",
    registrado: typeof registrado === "boolean" ? registrado : null,
    origem: origem || "site",
    criadoEm: Date.now(),
  });

  await fbMarkSold(pokemon.id);
  await aplicarBloqueioConta(pokemon.conta, data, pokemon.id);
}

function formatDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;

function datasFuturas(datas) {
  if (!Array.isArray(datas)) return [];
  const hoje = new Date();
  const hojeStr = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, "0")}-${String(hoje.getDate()).padStart(2, "0")}`;

/* ---------- render catalog ---------- */
function sexoSymbol(sexo) {
  return sexo === "Macho" ? "♂" : sexo === "Fêmea" ? "♀" : "—";
}

let categoriaAtiva = "";
let abaAtiva = "shinys"; // "shinys" | "contas" | "leilao"

function renderCatalog(query) {
  const grid = document.getElementById("grid");
  let filtered = POKES.filter((p) => {
    const matchNome = p.nome.toLowerCase().includes((query || "").toLowerCase());
    if (categoriaAtiva === "__novos__") {
      return matchNome && ehNovo(p);
    }
    const matchCategoria = !categoriaAtiva || p.categoria === categoriaAtiva;
    return matchNome && matchCategoria;
  });
  if (categoriaAtiva === "__novos__") {
    filtered = filtered.slice().sort((a, b) => (b.order || 0) - (a.order || 0));
  }
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><div style="font-size:30px;">✨</div><p>Nenhum shiny encontrado.</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map((p) => {
    const datasValidas = datasFuturas(p.datas);
    const soldOut = datasValidas.length === 0 || p.reservado === true;
    const tagLabel = p.reservado ? "Reservado" : "Vendido";
    return `
      <button class="card ${soldOut ? "card--sold" : ""}" data-id="${p.id}" ${soldOut ? "disabled" : ""}>
        <div class="card-photo">
          ${p.foto ? `<img src="${p.foto}" alt="${esc(p.nome)}" />` : `<div class="card-photo-empty">✨</div>`}
          <span class="card-spark">✨</span>
          ${ehNovo(p) ? `<span class="new-badge">NOVO</span>` : ""}
          ${p.foto ? `<span class="zoom-btn" data-zoom="${p.id}">🔍 Ampliar</span>` : ""}
          ${soldOut ? `<div class="card-soldtag">${tagLabel}</div>` : ""}
        </div>
        <div class="card-body">
          <div class="card-toprow">
            <h3>${esc(p.nome)}</h3>
            <span class="card-price">${formatBRL(p.preco)}</span>
          </div>
          <div class="card-meta">
            ${p.sexo ? `<span class="card-sexo">${sexoSymbol(p.sexo)} ${esc(p.sexo)}</span>` : ""}
            ${p.categoria ? `<span class="cat-tag">${esc(p.categoria)}</span>` : ""}
          </div>
          <div class="card-dates">
            📅 ${soldOut ? "—" : `${datasValidas.length} data${datasValidas.length > 1 ? "s" : ""} disponíve${datasValidas.length > 1 ? "is" : "l"}`}
          </div>
        </div>
      </button>
    `;
  }).join("");

  grid.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("click", () => {
      const id = card.getAttribute("data-id");
      const poke = POKES.find((p) => p.id === id);
      if (poke) openCheckout(poke);
    });
  });

  grid.querySelectorAll("[data-zoom]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.getAttribute("data-zoom");
      const poke = POKES.find((p) => p.id === id);
      if (poke) openLightbox(poke.fotoOriginal || poke.foto, poke.nome);
    });
  });
}

      `;
    }

    overlay.innerHTML = "";
    overlay.appendChild(modal);

    modal.querySelector("#auth-close").addEventListener("click", () => overlay.remove());
    modal.querySelector("#auth-switch").addEventListener("click", () => { modo = modo === "login" ? "cadastro" : "login"; render(); });

    modal.querySelector("#auth-submit").addEventListener("click", async () => {
      const whats = modal.querySelector("#auth-whats").value.trim();
      const senha = modal.querySelector("#auth-senha").value;
      const errEl = modal.querySelector("#auth-err");
      errEl.style.display = "none";
      const btn = modal.querySelector("#auth-submit");
      btn.disabled = true;
      try {
        if (modo === "cadastro") {
          const nome = modal.querySelector("#auth-nome").value.trim();
          if (!nome || !whats || senha.length < 6) throw new Error("Preencha nome, WhatsApp e uma senha com 6+ caracteres.");
          const user = await fbCadastrarCliente(nome, whats, senha);
          clienteAtual = { uid: user.uid, nome, whatsapp: whats };
        } else {
          if (!whats || !senha) throw new Error("Preencha WhatsApp e senha.");
          const user = await fbLoginCliente(whats, senha);
          const perfil = await fbPerfilCliente(user.uid);
          clienteAtual = { uid: user.uid, nome: perfil?.nome || "", whatsapp: perfil?.whatsapp || whats };
        }
        overlay.remove();
        atualizarContadorCarrinho();
        aoLogar();
      } catch (err) {

        if (msg.includes("auth/invalid-credential") || msg.includes("auth/wrong-password") || msg.includes("auth/user-not-found")) msg = "WhatsApp ou senha incorretos.";
        if (msg.includes("auth/email-already-in-use")) msg = "Já existe uma conta com esse WhatsApp. Toque em \"Já tenho conta\".";
        errEl.textContent = msg;
        errEl.style.display = "block";
        btn.disabled = false;
      }
    });
  }

  render();
  document.body.appendChild(overlay);
}

function formatContagemRegressiva(expiraEm) {
  const restante = expiraEm - Date.now();
  if (restante <= 0) return "expirando...";
  const h = Math.floor(restante / 3600000);
  const m = Math.floor((restante % 3600000) / 60000);
  return `expira em ${h}h ${m}min`;
}

  if (!clienteAtual) {
    openClienteAuth(() => abrirCarrinho());

  const state = { step: 1, itens: [], carregando: true, paymentId: null, qrText: "", qrImg: "", pollTimer: null, criando: false, erro: null };

  overlay.className = "overlay";
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);

  function closeModal() {
    if (state.pollTimer) clearInterval(state.pollTimer);
    overlay.remove();
  }

  async function carregarItens() {
    state.carregando = true;
    render();
    const reservas = await fbCarregarReservas();
    state.itens = reservas.filter((r) => r.clienteUid === clienteAtual.uid && !reservaExpirada(r));
    state.carregando = false;
    render();
  }

  async function removerItem(reservaId) {
    const item = state.itens.find((i) => i.id === reservaId);
    if (!item) return;
    await liberarReserva(item);
    await loadCatalog();
    renderCatalog(document.getElementById("search-input")?.value || "");
    await atualizarContadorCarrinho();
    await carregarItens();
  }

  function waHrefCarrinho() {
    const num = (CONFIG.whatsapp || "").replace(/\D/g, "");
    const nomes = state.itens.map((i) => i.pokemonNome).join(", ");
    const msg = `Olá! Paguei pelo carrinho: ${nomes}. Pode combinar comigo os detalhes das trocas?`;
    return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
  }

  async function criarPagamentoCarrinho() {
    state.step = 2;
    state.criando = true;
    render();
    const total = state.itens.reduce((s, i) => s + (Number(i.preco) || 0), 0);
    const orderId = uid();
    try {
      const resp = await fetch("/.netlify/functions/create-payment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          pokemonId: "carrinho-" + orderId,
          nome: `Carrinho (${state.itens.length} ${state.itens.length === 1 ? "item" : "itens"})`,
          preco: total,
          email: whatsappParaEmail(clienteAtual.whatsapp),
          orderId,
        }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Erro ao gerar Pix");
      state.paymentId = data.paymentId;
      state.qrText = data.qrCodeText;
      state.qrImg = data.qrCodeBase64;
      state.criando = false;
      render();
      iniciarPolling();
    } catch (err) {
      state.criando = false;
      state.erro = err.message;
      render();
    }
  }

  function iniciarPolling() {
    verificarPagamento();
    state.pollTimer = setInterval(verificarPagamento, 4000);
  }

  async function verificarPagamento() {
    if (!state.paymentId) return;
    try {
      const resp = await fetch(`/.netlify/functions/check-payment?id=${state.paymentId}`);
      const data = await resp.json();
      if (data.status === "approved") {
        clearInterval(state.pollTimer);
        for (const item of state.itens) {
          await registrarVendaEBloquear({
            vendaId: `${state.paymentId}-${item.pokemonId}`,
            pokemon: { id: item.pokemonId, nome: item.pokemonNome, foto: item.pokemonFoto, preco: item.preco, conta: item.conta },
            data: item.data,
            clienteNome: clienteAtual.nome,
            clienteWhatsapp: clienteAtual.whatsapp,
            clienteUid: clienteAtual.uid,
            origem: "site",
            registrado: item.registrado,
          });
          try { await deleteDoc(doc(db, RESERVAS_COLLECTION, item.id)); } catch (err) { console.error(err); }
        }
        await loadCatalog();
        renderCatalog(document.getElementById("search-input")?.value || "");
        await atualizarContadorCarrinho();
        state.step = 3;
        render();
      }
    } catch (err) {
      // silencioso — tenta de novo no próximo ciclo
    }
  }

  function render() {
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.addEventListener("click", (e) => e.stopPropagation());
    overlay.innerHTML = "";
    overlay.appendChild(modal);

    if (state.step === 1) {
      if (state.carregando) {
        modal.innerHTML = `<button class="modal-close" id="close-btn">×</button><div class="success"><div class="icon">🛒</div><h2>Carregando carrinho...</h2></div>`;
        modal.querySelector("#close-btn").addEventListener("click", closeModal);
        return;
      }

      if (state.itens.length === 0) {
        modal.innerHTML = `
          <button class="modal-close" id="close-btn">×</button>
          <div class="success">
            <div class="icon">🛒</div>
            <h2>Seu carrinho está vazio</h2>
            <p class="muted">Escolha um Pokémon na loja e toque em "Adicionar ao carrinho".</p>
            <button class="btn btn--ghost" id="close-btn2">Fechar</button>
          </div>
        `;
        modal.querySelector("#close-btn").addEventListener("click", closeModal);
        modal.querySelector("#close-btn2").addEventListener("click", closeModal);
        return;
      }

      const total = state.itens.reduce((s, i) => s + (Number(i.preco) || 0), 0);
      modal.innerHTML = `
        <button class="modal-close" id="close-btn">×</button>
        <h2>🛒 Seu carrinho</h2>
        <div class="cart-list">
          ${state.itens.map((item) => `
            <div class="cart-item">
              ${item.pokemonFoto ? `<img src="${item.pokemonFoto}" alt="" />` : `<div class="ph">✨</div>`}
              <div class="cart-item-info">
                <strong>${esc(item.pokemonNome)}</strong>
                <div class="sub">Entrega ${formatDate(item.data)} · <span class="countdown">⏳ ${formatContagemRegressiva(item.expiraEm)}</span></div>
              </div>
              <button data-remove="${item.id}">Remover</button>
            </div>
          `).join("")}
        </div>
        <div class="total-row">
          <span class="muted">Total (${state.itens.length} ${state.itens.length === 1 ? "item" : "itens"})</span>
          <span class="num">${formatBRL(total)}</span>
        </div>
        <button class="btn btn--primary" id="pagar-btn" style="width:100%; margin-top:14px;">Pagar tudo com Pix</button>
      `;
      modal.querySelector("#close-btn").addEventListener("click", closeModal);
      modal.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await removerItem(btn.getAttribute("data-remove"));
        });
      });
      modal.querySelector("#pagar-btn").addEventListener("click", criarPagamentoCarrinho);
    }

    if (state.step === 2) {
      if (state.criando) {
        modal.innerHTML = `<button class="modal-close" id="close-btn">×</button><div class="success"><div class="icon">✨</div><h2>Gerando seu Pix...</h2><p class="muted">Só um instante.</p></div>`;
        modal.querySelector("#close-btn").addEventListener("click", closeModal);
        return;
      }
      if (state.erro) {
        modal.innerHTML = `
          <button class="modal-close" id="close-btn">×</button>
          <button class="back-link" id="back-btn">← Voltar</button>
          <div class="success"><div class="icon">⚠️</div><h2>Não deu pra gerar o Pix</h2><p class="muted">${esc(state.erro)}</p></div>
        `;
        modal.querySelector("#close-btn").addEventListener("click", closeModal);
        modal.querySelector("#back-btn").addEventListener("click", () => { state.step = 1; state.erro = null; render(); });
        return;
      }
      const total = state.itens.reduce((s, i) => s + (Number(i.preco) || 0), 0);
      modal.innerHTML = `
        <button class="modal-close" id="close-btn">×</button>
        <h2>Pagamento via Pix</h2>
        <p class="muted">Pague ${formatBRL(total)} escaneando o QR Code ou usando o "copia e cola". A confirmação é automática pra todos os itens do carrinho.</p>
        ${state.qrImg ? `<img src="data:image/png;base64,${state.qrImg}" alt="QR Code Pix" style="width:100%;max-width:240px;display:block;margin:14px auto;border-radius:12px;background:#fff;padding:10px;" />` : ""}
        <div class="pixbox">
          <span style="word-break:break-all;">${esc(state.qrText || "")}</span>
          <button id="copy-btn">📋</button>
        </div>
        <div class="waiting-row"><span class="spinner"></span> Aguardando confirmação do pagamento...</div>
        <button class="btn btn--ghost" id="check-now-btn" style="margin-top:10px;">Já paguei, verificar agora</button>
      `;
      modal.querySelector("#close-btn").addEventListener("click", closeModal);
      modal.querySelector("#copy-btn").addEventListener("click", () => {
        navigator.clipboard?.writeText(state.qrText || "");

      });

    }

    if (state.step === 3) {
      modal.innerHTML = `
        <button class="modal-close" id="close-btn">×</button>
        <div class="success">
          <div class="icon">✅</div>

          <a class="btn btn--whats" href="${waHrefCarrinho()}" target="_blank" rel="noreferrer">💬 Falar no WhatsApp</a>
          <button class="btn btn--ghost" id="close-btn2">Fechar</button>
        </div>
      `;
      modal.querySelector("#close-btn").addEventListener("click", closeModal);
      modal.querySelector("#close-btn2").addEventListener("click", closeModal);
    }
  }

}

/* ---------- recorte automático de imagem (igual ao que o Claude fazia) ---------- */
function readFileAsImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function processPokeImage(img) {
  const w = img.naturalWidth, h = img.naturalHeight;
  const srcCanvas = document.createElement("canvas");
  srcCanvas.width = w; srcCanvas.height = h;
  const sctx = srcCanvas.getContext("2d");
  sctx.drawImage(img, 0, 0);

  let bottom = h;
  try {
    const imgData = sctx.getImageData(0, Math.min(300, h - 1), w, Math.max(1, h - Math.min(300, h - 1))).data;
    const startY = Math.min(300, h - 1);
    for (let y = 0; y < h - startY; y++) {
      let sum = 0, count = 0;
      for (let x = 0; x < w; x += 4) {
        const idx = (y * w + x) * 4;
        sum += (imgData[idx] + imgData[idx + 1] + imgData[idx + 2]) / 3;
        count++;
      }
      if (count && sum / count > 235) { bottom = startY + y; break; }
    }
  } catch (err) {
    bottom = h;
  }

  const top = Math.min(100, Math.floor(h * 0.06));
  const cropH = Math.max(80, Math.min(bottom + 20, h) - top);

  const thumbW = 560;
  const thumbH = Math.round(cropH * thumbW / w);
  const thumbCanvas = document.createElement("canvas");
  thumbCanvas.width = thumbW; thumbCanvas.height = thumbH;
  thumbCanvas.getContext("2d").drawImage(srcCanvas, 0, top, w, cropH, 0, 0, thumbW, thumbH);
  const thumb = thumbCanvas.toDataURL("image/jpeg", 0.72);

  const fullW = 520;
  const fullH = Math.round(h * fullW / w);
  const fullCanvas = document.createElement("canvas");
  fullCanvas.width = fullW; fullCanvas.height = fullH;
  fullCanvas.getContext("2d").drawImage(srcCanvas, 0, 0, w, h, 0, 0, fullW, fullH);
  const full = fullCanvas.toDataURL("image/jpeg", 0.62);

  return { thumb, full };
}

function dateRangeArray(from, to) {
  const out = [];
  if (!from || !to) return out;
  let d = new Date(from + "T00:00:00");
  const end = new Date(to + "T00:00:00");
  if (isNaN(d) || isNaN(end) || d > end) return out;
  while (d <= end) {
    out.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

/* ---------- calendário de seleção de dias (multi-mês) ---------- */
const MCAL_MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function mcalPad(n) { return String(n).padStart(2, "0"); }

function mcalBuildMonth(year, month, selectedSet, todayStr) {
  const firstDow = new Date(year, month, 1).getDay();
  const totalDays = new Date(year, month + 1, 0).getDate();
  let cells = "";
  for (let i = 0; i < firstDow; i++) cells += `<div class="mcal-day mcal-day--empty"></div>`;
  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${year}-${mcalPad(month + 1)}-${mcalPad(d)}`;
    const classes = ["mcal-day"];
    if (selectedSet.has(dateStr)) classes.push("mcal-day--selected");
    if (dateStr < todayStr) classes.push("mcal-day--past");
    cells += `<button type="button" class="${classes.join(" ")}" data-date="${dateStr}">${d}</button>`;
  }
  return `
    <div class="mcal-month">
      <div class="mcal-month-title">${MCAL_MESES[month]} ${year}</div>
      <div class="mcal-weekdays"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
      <div class="mcal-grid">${cells}</div>
    </div>
  `;
}

// Monta e "religa" o calendário dentro de containerEl, mostrando meses suficientes
// pra cobrir os dias já selecionados (com mínimo de mcalMinMonths meses).
function mcalRender(containerEl, summaryEl, selectedSet, mcalMinMonths) {
  const now = new Date();
  const baseYear = now.getFullYear();
  const baseMonth = now.getMonth();
  const todayStr = `${baseYear}-${mcalPad(baseMonth + 1)}-${mcalPad(now.getDate())}`;

  let monthsToShow = mcalMinMonths;
  selectedSet.forEach((d) => {
    const [y, m] = d.split("-").map(Number);
    const idx = (y - baseYear) * 12 + (m - 1 - baseMonth) + 1;
    if (idx > monthsToShow) monthsToShow = idx;
  });
  monthsToShow = Math.min(monthsToShow, 18); // limite de segurança

  let html = "";
  let y = baseYear, m = baseMonth;
  for (let i = 0; i < monthsToShow; i++) {
    html += mcalBuildMonth(y, m, selectedSet, todayStr);
    m++;
    if (m > 11) { m = 0; y++; }
  }
  containerEl.innerHTML = html;

  const updateSummary = () => {
    if (!summaryEl) return;
    summaryEl.textContent = selectedSet.size === 0
      ? "Nenhum dia selecionado"
      : `📌 ${selectedSet.size} dia(s) selecionado(s)`;
  };
  updateSummary();

  containerEl.querySelectorAll(".mcal-day[data-date]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const d = btn.getAttribute("data-date");
      if (selectedSet.has(d)) {
        selectedSet.delete(d);
        btn.classList.remove("mcal-day--selected");
      } else {
        selectedSet.add(d);
        btn.classList.add("mcal-day--selected");
      }
      updateSummary();
      // se marcou um dia no último mês visível, redesenha pra abrir mais um mês
      const lastMonthEl = containerEl.querySelector(".mcal-month:last-child");
      if (lastMonthEl && lastMonthEl.contains(btn)) {
        mcalRender(containerEl, summaryEl, selectedSet, mcalMinMonths);
      }
    });
  });
}

          <h2>📊 Histórico de vendas</h2>
          <div class="search-row">
            🔍 <input id="adm-vendas-busca" placeholder="Buscar por Pokémon ou comprador..." />
          </div>
          <div class="date-range-row" style="margin-bottom:10px;">
            <label>Conta</label>
            <select id="adm-vendas-conta">
              <option value="">Todas</option>
              ${CONTAS.map((c) => `<option value="${c}">${c}</option>`).join("")}
            </select>
            <label>Entrega de</label>
            <input type="date" id="adm-vendas-de" />
            <label>até</label>
            <input type="date" id="adm-vendas-ate" />
            <button class="btn btn--ghost" id="adm-vendas-limpar" style="padding:6px 12px; font-size:12px;">Limpar filtros</button>
          </div>
          <div class="vendas-summary" id="adm-vendas-summary"></div>
          <div class="admin-list" id="adm-vendas-list">
            <p class="muted">Carregando...</p>
          </div>
        </div>
      </div>
    `;

    document.getElementById("adm-exit-btn").addEventListener("click", async () => {
      renderShell();
    });


    mcalRender(document.getElementById("adm-calendar"), document.getElementById("adm-calendar-summary"), admSelectedDates, 6);
    renderCurrentList();
    wireUpload();
    loadVendasList();
    const contaFilter = document.getElementById("adm-conta-filter");
    const buscaInput = document.getElementById("adm-busca");
    if (contaFilter) {
      contaFilter.addEventListener("change", () => renderCurrentList(contaFilter.value, buscaInput.value));
    }
    if (buscaInput) {
      buscaInput.addEventListener("input", () => renderCurrentList(contaFilter?.value, buscaInput.value));
    }

    const vBusca = document.getElementById("adm-vendas-busca");
    const vConta = document.getElementById("adm-vendas-conta");
    const vDe = document.getElementById("adm-vendas-de");
    const vAte = document.getElementById("adm-vendas-ate");
    const vLimpar = document.getElementById("adm-vendas-limpar");
    [vBusca, vConta, vDe, vAte].forEach((el) => {
      el.addEventListener("input", renderVendasList);
      el.addEventListener("change", renderVendasList);
    });
    vLimpar.addEventListener("click", () => {
      vBusca.value = "";
      vConta.value = "";
      vDe.value = "";
      vAte.value = "";
      renderVendasList();
    });
  }

  let vendasCache = [];

  async function loadVendasList() {
    const el = document.getElementById("adm-vendas-list");
    if (!el) return;
    try {
      vendasCache = await fbCarregarVendas();
      vendasCache.sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
      renderVendasList();
    } catch (err) {
      console.error(err);
      el.innerHTML = `<p class="muted">Não consegui carregar o histórico agora.</p>`;
    }
  }

  function renderVendasList() {
    const el = document.getElementById("adm-vendas-list");
    const summaryEl = document.getElementById("adm-vendas-summary");
    if (!el) return;

    const busca = (document.getElementById("adm-vendas-busca")?.value || "").trim().toLowerCase();
    const conta = document.getElementById("adm-vendas-conta")?.value || "";
    const de = document.getElementById("adm-vendas-de")?.value || "";
    const ate = document.getElementById("adm-vendas-ate")?.value || "";

    const filtradas = vendasCache.filter((v) => {
      const matchBusca = !busca || (v.pokemonNome || "").toLowerCase().includes(busca) || (v.clienteNome || "").toLowerCase().includes(busca);
      const matchConta = !conta || v.conta === conta;
      const matchDe = !de || v.data >= de;
      const matchAte = !ate || v.data <= ate;
      return matchBusca && matchConta && matchDe && matchAte;
    });

    const total = filtradas.reduce((soma, v) => soma + (Number(v.preco) || 0), 0);
    if (summaryEl) {
      summaryEl.innerHTML = `
        <div class="summary-box"><div class="num">${filtradas.length}</div><div class="lbl">venda${filtradas.length === 1 ? "" : "s"} no filtro</div></div>
        <div class="summary-box"><div class="num">${formatBRL(total)}</div><div class="lbl">total arrecadado</div></div>
      `;
    }

    if (filtradas.length === 0) {
      el.innerHTML = `<p class="muted">Nenhuma venda encontrada.</p>`;
      return;
    }

    el.innerHTML = filtradas.map((v) => {
      const regTag = v.registrado === true
        ? `<span class="tag tag--reg-sim">✅ Já registrado</span>`
        : v.registrado === false
          ? `<span class="tag tag--reg-nao">⛔ Não registrado</span>`
          : "";
      return `
        <div class="venda-row">
          ${v.pokemonFoto ? `<img src="${v.pokemonFoto}" alt="" />` : `<div class="ph">✨</div>`}
          <div class="venda-info">
            <div class="top"><strong>${esc(v.pokemonNome || "")}</strong><span class="venda-price">${formatBRL(v.preco || 0)}</span></div>
            <div class="venda-sub">
              ${v.conta ? `<span class="tag tag--conta">${esc(v.conta)}</span>` : ""}${regTag}${v.origem === "manual" ? `<span class="tag tag--manual">manual</span>` : ""}<br>
              ${esc(v.clienteNome || "")} · ${esc(v.clienteWhatsapp || "")} · entrega ${formatDate(v.data)}
            </div>
          </div>
          <button class="danger" data-del-venda="${v.id}" title="Excluir do histórico">Excluir</button>
        </div>
      `;
    }).join("");

    el.querySelectorAll("[data-del-venda]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Excluir esse registro do histórico? Isso não desfaz a venda nem devolve o Pokémon pra loja, só apaga o registro.")) return;
        btn.disabled = true;
        try {
          await fbExcluirVenda(btn.getAttribute("data-del-venda"));
          vendasCache = vendasCache.filter((v) => v.id !== btn.getAttribute("data-del-venda"));
          renderVendasList();
          showToast("Registro excluído");
        } catch (err) {
          console.error(err);
          alert("Erro ao excluir: " + err.message);
          btn.disabled = false;
        }
      });
    });
  }

  function renderCurrentList(contaFiltro, buscaTexto) {
    const list = document.getElementById("adm-current-list");
    const busca = (buscaTexto || "").trim().toLowerCase();
    const items = POKES.filter((p) => {
      const matchConta = !contaFiltro || p.conta === contaFiltro;
      const matchBusca = !busca || p.nome.toLowerCase().includes(busca);
      return matchConta && matchBusca;
    });
    if (items.length === 0) {
      list.innerHTML = `<p class="muted">Nenhum Pokémon encontrado.</p>`;
      return;
    }
    list.innerHTML = items.map((p) => {
      const soldOut = !p.datas || p.datas.length === 0;
      return `
        <div class="admin-row">
          ${p.foto ? `<img src="${p.foto}" alt="" />` : ""}
          <div class="admin-row-info">
            <strong>${esc(p.nome)}</strong>
            <span>${formatBRL(p.preco)} · ${soldOut ? "vendido" : `${p.datas.length} data(s)`}${p.conta ? ` · <span class="conta-tag">${esc(p.conta)}</span>` : ""}</span>
          </div>
          ${!soldOut ? `<button data-sold="${p.id}">Marcar vendido</button>` : ""}
          <button data-edit="${p.id}">Editar</button>
          <button class="danger" data-del="${p.id}">Excluir</button>
        </div>
      `;
    }).join("");

    list.querySelectorAll("[data-sold]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const p = POKES.find((x) => x.id === btn.getAttribute("data-sold"));
        if (p) openMarcarVendidoModal(p, contaFiltro, buscaTexto);
      });
    });
    list.querySelectorAll("[data-edit]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const p = POKES.find((x) => x.id === btn.getAttribute("data-edit"));
        if (p) openEditModal(p, contaFiltro, document.getElementById("adm-busca")?.value);
      });
    });
    list.querySelectorAll("[data-del]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Excluir esse Pokémon do catálogo?")) return;
        btn.disabled = true;
        try {
          await fbDeletePoke(btn.getAttribute("data-del"));
          await loadCatalog();
          renderCurrentList(document.getElementById("adm-conta-filter")?.value, document.getElementById("adm-busca")?.value);
          showToast("Excluído");
        } catch (err) {
          console.error(err);
          alert("Erro ao excluir: " + err.message);
          btn.disabled = false;
        }
      });
    });
  }

  function openMarcarVendidoModal(p, contaFiltro, buscaTexto) {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });

    const modal = document.createElement("div");
    modal.className = "modal";
    modal.addEventListener("click", (e) => e.stopPropagation());
    modal.innerHTML = `
      <button class="modal-close" id="ms-close">×</button>
      <h2>Marcar vendido</h2>
      <p class="muted">${esc(p.nome)} · ${formatBRL(p.preco)}${p.conta ? ` · ${esc(p.conta)}` : ""}</p>
      <label class="field-label">Data de entrega</label>
      <select class="input" id="ms-data">
        ${(p.datas || []).map((d) => `<option value="${d}">${formatDate(d)}</option>`).join("")}
      </select>
      <label class="field-label">Nome do comprador</label>
      <input class="input" id="ms-nome" />
      <label class="field-label">WhatsApp do comprador</label>
      <input class="input" id="ms-whats" placeholder="Ex: 62999990000" />
      <label class="field-label">Já tinha registrado?</label>
      <div class="toggle-row">
        <button type="button" class="toggle-btn toggle-btn--active" data-reg="sim" id="ms-reg-sim">✅ Sim</button>
        <button type="button" class="toggle-btn" data-reg="nao" id="ms-reg-nao">⛔ Não</button>
      </div>
      <p class="err" id="ms-err" style="display:none;"></p>
      <button class="btn btn--primary" id="ms-save" style="margin-top:14px;">Confirmar e marcar vendido</button>
    `;
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    modal.querySelector("#ms-close").addEventListener("click", () => overlay.remove());
    let msRegistrado = true;
    modal.querySelector("#ms-reg-sim").addEventListener("click", () => {
      msRegistrado = true;
      modal.querySelector("#ms-reg-sim").classList.add("toggle-btn--active");
      modal.querySelector("#ms-reg-nao").classList.remove("toggle-btn--active");
    });
    modal.querySelector("#ms-reg-nao").addEventListener("click", () => {
      msRegistrado = false;
      modal.querySelector("#ms-reg-nao").classList.add("toggle-btn--active");
      modal.querySelector("#ms-reg-sim").classList.remove("toggle-btn--active");
    });
    modal.querySelector("#ms-save").addEventListener("click", async () => {
      const data = modal.querySelector("#ms-data").value;
      const nome = modal.querySelector("#ms-nome").value.trim();
      const whats = modal.querySelector("#ms-whats").value.trim();
      const errEl = modal.querySelector("#ms-err");
      if (!data || !nome || !whats) {
        errEl.textContent = "Preencha data, nome e WhatsApp.";
        errEl.style.display = "block";
        return;
      }
      const btn = modal.querySelector("#ms-save");
      btn.disabled = true;
      btn.textContent = "Salvando...";
      try {
        await registrarVendaEBloquear({
          vendaId: "manual-" + uid(),
          pokemon: p,
          data,
          clienteNome: nome,
          clienteWhatsapp: whats,
          clienteUid: "",
          origem: "manual",
          registrado: msRegistrado,
        });
        await loadCatalog();
        overlay.remove();
        renderCurrentList(contaFiltro, buscaTexto);
        showToast("Venda registrada");
      } catch (err) {
        console.error(err);
        errEl.textContent = "Erro: " + err.message;
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Confirmar e marcar vendido";
      }
    });
  }

  function openEditModal(p, contaFiltro, buscaTexto) {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });

    const editSelectedDates = new Set(p.datas || []);
    let novaFoto = null; // { thumb, full } se trocar a foto

    const modal = document.createElement("div");
    modal.className = "modal";
    modal.addEventListener("click", (e) => e.stopPropagation());
    modal.innerHTML = `
      <button class="modal-close" id="edit-close-btn">×</button>
      <h2>Editar Pokémon</h2>
      <label class="field-label">Foto atual</label>
      <img src="${p.foto}" alt="" style="width:100px;height:100px;object-fit:cover;border-radius:10px;margin-bottom:8px;" id="edit-photo-preview" />
      <label class="file-drop" id="edit-file-drop" style="margin-bottom:10px;">
        📤 Toque pra trocar a foto (opcional)
        <input type="file" id="edit-file-input" accept="image/*" hidden />
      </label>
      <label class="field-label">Nome</label>
      <input class="input" id="edit-nome" value="${esc(p.nome)}" />
      <label class="field-label">Preço (R$)</label>
      <input class="input" id="edit-preco" type="number" min="0" step="0.01" value="${p.preco}" />
      <label class="field-label">Sexo</label>
      <select class="input" id="edit-sexo">
        <option value="Macho" ${p.sexo === "Macho" ? "selected" : ""}>Macho</option>
        <option value="Fêmea" ${p.sexo === "Fêmea" ? "selected" : ""}>Fêmea</option>
      </select>
      <label class="field-label">Conta</label>
      <select class="input" id="edit-conta">
        ${CONTAS.map((c) => `<option value="${c}" ${p.conta === c ? "selected" : ""}>${c}</option>`).join("")}
      </select>
      <label class="field-label">Categoria</label>
      <select class="input" id="edit-categoria">
        ${CATEGORIAS.map((c) => `<option value="${c}" ${p.categoria === c ? "selected" : ""}>${c}</option>`).join("")}
      </select>
      <label class="field-label">Dias disponíveis</label>
      <div class="mcal-wrap" id="edit-calendar"></div>
      <div class="mcal-summary" id="edit-calendar-summary"></div>
      <p class="muted" style="margin-top:6px;">Deixe todos os dias desmarcados pra marcar como vendido.</p>
      <button class="btn btn--primary" id="edit-save-btn" style="margin-top:16px;">Salvar alterações</button>
    `;
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    document.getElementById("edit-close-btn").addEventListener("click", () => overlay.remove());

    mcalRender(document.getElementById("edit-calendar"), document.getElementById("edit-calendar-summary"), editSelectedDates, 6);

    const dropEl = document.getElementById("edit-file-drop");
    const inputEl = document.getElementById("edit-file-input");
    dropEl.addEventListener("click", () => inputEl.click());
    inputEl.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      dropEl.textContent = "Processando...";
      try {
        const img = await readFileAsImage(file);
        novaFoto = processPokeImage(img);
        document.getElementById("edit-photo-preview").src = novaFoto.thumb;
        dropEl.textContent = "📤 Foto trocada (toque pra escolher outra)";
      } catch (err) {
        console.error(err);
        dropEl.textContent = "📤 Toque pra trocar a foto (opcional)";
      }
    });

    document.getElementById("edit-save-btn").addEventListener("click", async () => {
      const nome = document.getElementById("edit-nome").value.trim();
      const preco = Number(document.getElementById("edit-preco").value);
      const sexo = document.getElementById("edit-sexo").value;
      const conta = document.getElementById("edit-conta").value;
      const categoria = document.getElementById("edit-categoria").value;
      if (!nome) { alert("Preencha o nome."); return; }
      const novasDatasBrutas = Array.from(editSelectedDates).sort();

      const saveBtn = document.getElementById("edit-save-btn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Salvando...";
      try {
        const novasDatas = await filtrarDatasDisponiveisConta(conta, novasDatasBrutas);
        const fields = { nome, preco, sexo, conta, categoria, datas: novasDatas };
        if (novaFoto) {
          fields.foto = novaFoto.thumb;
          fields.fotoOriginal = novaFoto.full;
        }
        await fbUpdatePoke(p.id, fields);
        await loadCatalog();
        overlay.remove();
        renderCurrentList(contaFiltro, buscaTexto);
        showToast("Pokémon atualizado");
      } catch (err) {
        console.error(err);
        alert("Erro ao salvar: " + err.message);
        saveBtn.disabled = false;
        saveBtn.textContent = "Salvar alterações";
      }
    });
  }

  function renderPendingList() {
    const list = document.getElementById("adm-pending-list");
    const saveBtn = document.getElementById("adm-save-all-btn");
    list.innerHTML = pending.map((item, i) => `
      <div class="pending-card">
        <img src="${item.thumb}" alt="" />
        <div class="pending-fields">
          <input placeholder="Nome do Pokémon" value="${esc(item.nome)}" data-field="nome" data-i="${i}" />
          <div class="row">
            <input type="number" min="0" step="0.01" value="${item.preco}" data-field="preco" data-i="${i}" />
            <select data-field="sexo" data-i="${i}">
              <option value="Macho" ${item.sexo === "Macho" ? "selected" : ""}>Macho</option>
              <option value="Fêmea" ${item.sexo === "Fêmea" ? "selected" : ""}>Fêmea</option>
            </select>
          </div>
          <select data-field="conta" data-i="${i}">
            ${CONTAS.map((c) => `<option value="${c}" ${item.conta === c ? "selected" : ""}>${c}</option>`).join("")}
          </select>
          <select data-field="categoria" data-i="${i}">
            ${CATEGORIAS.map((c) => `<option value="${c}" ${item.categoria === c ? "selected" : ""}>${c}</option>`).join("")}
          </select>
        </div>
        <button class="pending-remove" data-remove="${i}">×</button>
      </div>
    `).join("");

    list.querySelectorAll("[data-field]").forEach((input) => {
      input.addEventListener("input", (e) => {
        const i = Number(e.target.getAttribute("data-i"));
        const field = e.target.getAttribute("data-field");
        pending[i][field] = field === "preco" ? Number(e.target.value) : e.target.value;
      });
    });
    list.querySelectorAll("[data-remove]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        const i = Number(e.target.getAttribute("data-remove"));
        pending.splice(i, 1);
        renderPendingList();
      });
    });

    saveBtn.classList.toggle("hidden", pending.length === 0);
  }

  function wireUpload() {
    const drop = document.getElementById("adm-file-drop");
    const input = document.getElementById("adm-file-input");
    drop.addEventListener("click", () => input.click());
    input.addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) return;
      drop.textContent = `Processando ${files.length} foto(s)...`;
      const contaDefault = document.getElementById("adm-conta-default").value;
      const categoriaDefault = document.getElementById("adm-categoria-default").value;
      for (const file of files) {
        try {
          const img = await readFileAsImage(file);
          const { thumb, full } = processPokeImage(img);
          pending.push({ nome: "", preco: 3, sexo: "Macho", conta: contaDefault, categoria: categoriaDefault, thumb, full });
        } catch (err) {
          console.error(err);
        }
      }
      drop.innerHTML = `📤 Toque aqui e escolha as fotos (pode selecionar várias de uma vez) <input type="file" id="adm-file-input" accept="image/*" multiple hidden />`;
      wireUpload();
      renderPendingList();
      input.value = "";
    });

    document.getElementById("adm-save-all-btn").onclick = async () => {
      const datas = Array.from(admSelectedDates).sort();
      if (datas.length === 0) {
        alert("Marque pelo menos um dia disponível no calendário antes de salvar.");
        return;
      }
      const semNome = pending.some((p) => !p.nome.trim());
      if (semNome) {
        alert("Preencha o nome de todos os Pokémons antes de salvar.");
        return;
      }
      const saveBtn = document.getElementById("adm-save-all-btn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Salvando...";
      for (const item of pending) {
        try {
          const datasFiltradas = await filtrarDatasDisponiveisConta(item.conta, datas);
          await fbAddPoke({
            nome: item.nome.trim(),
            preco: item.preco,
            sexo: item.sexo,
            conta: item.conta,
            categoria: item.categoria,
            foto: item.thumb,
            fotoOriginal: item.full,
            datas: datasFiltradas,
          });
        } catch (err) {
          console.error(err);
        }
      }
      pending = [];
      admSelectedDates = new Set();
      await loadCatalog();
      showToast("Pokémons adicionados!");
      renderAdmin();
    };
  }

  renderAdmin();
}
</script>

</body>
</html>
